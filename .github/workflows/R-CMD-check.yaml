name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: ubuntu-24.04, r: 'devel'}
    env:
      R_KEEP_PKG_SOURCE: yes
      # No TÜİK credentials are provided to CI. Tests must use local mocks.

    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install CRAN validation tools
        if: matrix.config.r == 'devel'
        run: |
          test -z "${TUIK_SDMX_API_KEY+x}"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qpdf tidy texinfo

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.r == 'devel'

      - name: Install and verify manual dependencies
        if: matrix.config.r == 'devel'
        run: |
          tlmgr update --self
          tlmgr install inconsolata courier
          kpsewhich inconsolata.sty
          kpsewhich pcrr8t.tfm
          pdflatex --version
          texi2dvi --version
          qpdf --version
          tidy --version

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Verify offline mocked tests
        if: matrix.config.r == 'devel'
        shell: Rscript {0}
        run: |
          stopifnot(is.na(Sys.getenv("TUIK_SDMX_API_KEY", unset = NA_character_)))
          Sys.unsetenv("TUIK_SDMX_API_KEY")
          for (f in c("curl_fetch_memory", "curl_fetch_disk",
                      "curl_fetch_stream", "multi_run")) {
            trace(f,
              tracer = quote(stop("Unexpected network call in offline tests")),
              print = FALSE, where = asNamespace("curl"))
          }
          testthat::test_local(".", reporter = "check")

      - uses: r-lib/actions/check-r-package@v2
        if: matrix.config.r != 'devel'
        with:
          upload-snapshots: false

      - name: Full R-devel CRAN check
        id: cran_check_devel
        if: matrix.config.r == 'devel'
        uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_CRAN_INCOMING_: 'true'
          _R_CHECK_CRAN_INCOMING_REMOTE_: 'true'
          _R_CHECK_FORCE_SUGGESTS_: 'true'
        with:
          args: 'c("--as-cran")'
          build_args: 'character()'
          error-on: '"warning"'
          upload-results: 'true'
          upload-snapshots: false

      - name: Diagnose indexed PDF failure (temporary)
        id: pdf_diagnostics
        if: failure() && matrix.config.r == 'devel' && steps.cran_check_devel.outcome == 'failure'
        shell: bash
        run: |
          unset TUIK_SDMX_API_KEY
          d="$RUNNER_TEMP/tuiksdmx-pdf-diagnostics"
          mkdir -p "$d"

          capture() {
            local label="$1" status=0
            shift
            "$@" >"$d/$label.stdout.log" 2>"$d/$label.stderr.log" || status=$?
            printf '%s exit=%s\n' "$label" "$status" | tee -a "$d/statuses.txt"
          }

          for tool in R pdflatex makeindex texi2dvi kpsewhich tlmgr; do
            printf '%s: ' "$tool"
            command -v "$tool" || true
          done >"$d/tool-paths.txt"
          capture R-version R --version
          capture Rd2pdf-help R CMD Rd2pdf --help
          capture R-texi2dvi-option Rscript --vanilla -e \
            'cat("texi2dvi option:", getOption("texi2dvi"), "\n")'
          capture pdflatex-version pdflatex --version
          capture makeindex-version makeindex </dev/null
          capture texi2dvi-version texi2dvi --version
          capture tlmgr-version tlmgr --version
          capture texlive-packages tlmgr info --only-installed inconsolata courier makeindex
          capture inconsolata-path kpsewhich inconsolata.sty
          capture courier-metric-path kpsewhich pcrr8t.tfm

          capture indexed-Rd2pdf R CMD Rd2pdf \
            --no-preview --internals --no-clean \
            --build-dir="$d/indexed" \
            --output="$d/indexed.pdf" "$GITHUB_WORKSPACE"

          # Replay tools in separate copies, preserving the original evidence.
          replay() {
            local tool="$1" pattern="$2" n=0 file
            shift 2
            [ -d "$d/indexed" ] || return 0
            cp -a "$d/indexed" "$d/$tool-replay"
            while IFS= read -r -d '' file; do
              n=$((n + 1))
              capture "$tool-replay-$n" bash -c \
                'cd "$1" || exit; shift; exec "$@"' _ \
                "$(dirname "$file")" "$tool" "$@" "$(basename "$file")"
            done < <(find "$d/$tool-replay" -type f -name "$pattern" -print0)
            printf '%s replay inputs=%s\n' "$tool" "$n" >>"$d/statuses.txt"
          }
          replay makeindex '*.idx'
          replay texi2dvi '*.tex' --pdf

      - name: Upload PDF diagnostics (temporary)
        if: always() && matrix.config.r == 'devel' && steps.cran_check_devel.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: R-devel-indexed-PDF-diagnostics
          path: ${{ runner.temp }}/tuiksdmx-pdf-diagnostics
